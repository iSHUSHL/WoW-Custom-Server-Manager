name: Apply Expansion Isolated Collections

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-expansion-isolated-collections.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch expansion isolated collections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          sm=Path('Sources/WoWServerControlCenter/ServerModel.swift')
          cat=Path('Sources/WoWServerControlCenter/Catalog.swift')
          cv=Path('Sources/WoWServerControlCenter/ContentView.swift')
          build=Path('Build.command')
          rel=Path('RELEASE-NOTES.md')
          s=sm.read_text()

          marker='    private func catalogWhereClause(kind: CatalogKind, search: String) -> String {\n'
          helper='''    private var expansionItemEntryClause: String {\n        switch selectedExpansion {\n        case .vanilla: return "entry BETWEEN 1 AND 24282"\n        case .tbc: return "entry BETWEEN 24283 AND 35599"\n        case .wotlk: return "entry BETWEEN 35600 AND 56805"\n        case .cataclysm: return "entry BETWEEN 56806 AND 79999"\n        case .mop: return "entry BETWEEN 80000 AND 109999"\n        default: return "1=1"\n        }\n    }\n\n'''
          if 'private var expansionItemEntryClause' not in s:
              s=s.replace(marker,helper+marker)
          s=s.replace('var clauses: [String] = ["1=1"]','var clauses: [String] = [expansionItemEntryClause]')

          old='''            resetCollectionStateForExpansionChange()\n            rebuildProcesses()\n            refresh()\n'''
          new='''            resetCollectionStateForExpansionChange()\n            rebuildProcesses()\n            refresh()\n            DispatchQueue.main.async {\n                self.catalogKind = .all\n                self.loadCatalogPage(reset: true)\n                self.loadGearSets()\n            }\n'''
          if old in s: s=s.replace(old,new,1)

          old='''        // Mount rows are inventory-less teaching items; class/slot/iLvl filters\n        // from another collection must never hide them by accident.\n        if catalogKind == .mount {\n            equipSlotFilter = .all\n            playerClassFilter = .all\n            minimumItemLevel = ""\n        }\n\n        loadCatalogPage(reset: true)\n'''
          new='''        searchText = ""\n        itemQualityFilter = .all\n        equipSlotFilter = .all\n        playerClassFilter = .all\n        minimumItemLevel = ""\n\n        loadCatalogPage(reset: true)\n'''
          if old in s: s=s.replace(old,new)

          # gear sets must use same era boundary
          s=s.replace('        let expansion = selectedExpansion\n\n        gearSetsLoading = true','        let expansion = selectedExpansion\n        let expansionClause = expansionItemEntryClause\n\n        gearSetsLoading = true',1)
          s=s.replace('WHERE itemset > 0\n                ORDER BY itemset','WHERE itemset > 0 AND \\(expansionClause)\n                ORDER BY itemset',1)

          sm.write_text(s)

          c=cat.read_text()
          a=c.index('    static func entries(for expansion: ExpansionID) -> [CatalogEntry] {')
          b=c.index('\n    static func iconForKnownItem',a)
          repl='''    static func entries(for expansion: ExpansionID) -> [CatalogEntry] {\n        switch expansion {\n        case .vanilla: return [item(19019, "Thunderfury, Blessed Blade of the Windseeker", .legendary, "One-Hand Sword", "inv_sword_39"), item(17182, "Sulfuras, Hand of Ragnaros", .legendary, "Two-Hand Mace", "inv_hammer_unique_sulfuras")]\n        case .tbc: return [item(32837, "Warglaive of Azzinoth", .legendary, "Main Hand Sword", "inv_weapon_glave_01"), item(32838, "Warglaive of Azzinoth", .legendary, "Off Hand Sword", "inv_weapon_glave_01"), item(34334, "Thori'dal, the Stars' Fury", .legendary, "Bow", "inv_weapon_bow_39")]\n        case .wotlk: return [item(49623, "Shadowmourne", .legendary, "Two-Hand Axe", "inv_axe_113"), item(46017, "Val'anyr, Hammer of Ancient Kings", .legendary, "One-Hand Mace", "inv_mace_99")]\n        case .cataclysm: return [item(71086, "Dragonwrath, Tarecgosa's Rest", .legendary, "Staff", "inv_staff_39"), item(77949, "Golad, Twilight of Aspects", .legendary, "Dagger", "inv_knife_1h_deathwingraid_d_01")]\n        case .mop: return [item(102245, "Qian-Le, Courage of Niuzao", .legendary, "Legendary Cloak", "inv_cape_pandaria_d_03")]\n        default: return []\n        }\n    }\n'''
          c=c[:a]+repl+c[b:]
          c=c.replace('entries(for: .wotlk).first(where: { $0.id == id })?.iconURL','[ExpansionID.vanilla,.tbc,.wotlk,.cataclysm,.mop].flatMap { entries(for: $0) }.first(where: { $0.id == id })?.iconURL')
          cat.write_text(c)

          v=cv.read_text().replace('Browse every collection in the selected expansion database — raid sets, weapons, armor, legendaries, BiS/endgame, bags, mounts and every item.','Era-isolated catalog: only items introduced in the selected expansion are shown. Switching expansion automatically loads that expansion.')
          cv.write_text(v)

          bt=build.read_text()
          bt=re.sub(r'<key>CFBundleShortVersionString</key><string>[^<]+</string>','<key>CFBundleShortVersionString</key><string>1.5.69</string>',bt,count=1)
          bt=re.sub(r'<key>CFBundleVersion</key><string>[^<]+</string>','<key>CFBundleVersion</key><string>1569</string>',bt,count=1)
          build.write_text(bt)

          note='''# v1.5.69 — Expansion-Isolated Complete Collections\n\n- Vanilla, TBC, WotLK, Cataclysm and MoP collections are isolated by item era so cumulative later DBs do not mix older-expansion items into the selected expansion.\n- Switching expansion automatically selects All Items and loads that expansion catalog plus its gear sets.\n- All Items, Legendaries, weapons, armor, raid sets, bags, mounts and BiS/endgame use the same expansion boundary.\n- Changing collection resets hidden filters so complete collections are not silently reduced.\n- Gear Sets uses the same expansion-only boundary.\n\n'''
          if not rel.read_text().startswith('# v1.5.69'):
              rel.write_text(note+rel.read_text())
          PY

          bash -n Build.command
          bash -n Verify.command
          find Scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 -m py_compile Scripts/*.py

      - name: Commit fix
        run: |
          rm .github/workflows/apply-expansion-isolated-collections.yml
          rm -f .github/workflows/apply-collection-browser-exhaustive-fix.yml
          git config user.name "WoWCC Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Separate complete collections by expansion"
          git push

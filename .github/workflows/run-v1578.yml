name: Run v1578 Patch

on:
  push:
    paths:
      - '.github/workflows/run-v1578.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 Scripts/apply-v1578.py
      - name: Validate shell
        run: |
          bash -n Build.command
          for f in Scripts/*.sh; do bash -n "$f"; done
      - name: Build release
        run: xcrun swift build -c release
      - name: Package source
        run: |
          rm -rf /tmp/WoWServerControlCenter-1.5.78
          mkdir -p /tmp/WoWServerControlCenter-1.5.78
          rsync -a --exclude '.git' --exclude '.build' --exclude 'Build' --exclude '.github/workflows/run-v1578.yml' ./ /tmp/WoWServerControlCenter-1.5.78/
          cd /tmp
          ditto -c -k --keepParent WoWServerControlCenter-1.5.78 "$GITHUB_WORKSPACE/WoWServerControlCenter-1.5.78-FullTooltipRepair.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: WoWServerControlCenter-1.5.78-FullTooltipRepair
          path: WoWServerControlCenter-1.5.78-FullTooltipRepair.zip
      - name: Commit changes
        run: |
          rm -f .github/workflows/run-v1578.yml Scripts/apply-v1578.py
          git config user.name 'Igor Baran'
          git config user.email 'igorbaran@gmail.com'
          git add -A
          git commit -m 'Add full local item tooltips and visible realm repair (1.5.78)'
          git push

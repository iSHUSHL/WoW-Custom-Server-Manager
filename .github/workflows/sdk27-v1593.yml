name: SDK27 v1593

on:
  push:
    paths:
      - '.github/workflows/sdk27-v1593.yml'

permissions:
  contents: write

# retry after state patcher correction
jobs:
  patch-build-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Apply SDK 27 UI fix
        run: python3 Scripts/apply-v1593-sdk27-ui-fix.py
      - name: Remove temporary patch files
        run: |
          rm -f Scripts/apply-v1593-sdk27-ui-fix.py
          rm -f .github/workflows/sdk27-v1593.yml
      - name: Validate scripts and app
        run: |
          bash -n Build.command
          find Scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          swift build -c release
      - name: Commit validated changes
        run: |
          git config user.name 'WoWCC Builder'
          git config user.email 'wowcc-builder@users.noreply.github.com'
          git add -A
          git commit -m 'Fix SDK 27 SwiftUI build compatibility (1.5.93)'
          git push origin main
      - name: Stage tracked source without nested ZIP
        run: |
          mkdir -p artifact/WoW-Custom-Server-Manager
          git archive --format=tar HEAD | tar -x -C artifact/WoW-Custom-Server-Manager
      - uses: actions/upload-artifact@v4
        with:
          name: WoWServerControlCenter-1.5.93-SDK27BuildFix-ONE-ZIP
          path: artifact/WoW-Custom-Server-Manager
          if-no-files-found: error

name: Premium UI v1582

on:
  push:
    paths:
      - '.github/workflows/premium-ui-v1582.yml'

permissions:
  contents: write

jobs:
  patch-build-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Apply premium UI rebuild
        run: python3 tools/apply_v1582_premium_ui.py

      - name: Remove temporary patch files
        run: |
          rm -f tools/apply_v1582_premium_ui.py
          rm -f .github/workflows/premium-ui-v1582.yml

      - name: Validate and build release
        run: |
          bash -n Build.command
          find Scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          grep -q '<string>1.5.82</string>' Build.command
          grep -q 'The Burning Crusade' Sources/WoWServerControlCenter/ContentView.swift
          grep -q 'premiumActionButton' Sources/WoWServerControlCenter/ContentView.swift
          grep -q 'premiumExpansions: \[ExpansionID\] = \[.vanilla, .tbc, .wotlk, .cataclysm, .mop\]' Sources/WoWServerControlCenter/ContentView.swift
          swift build -c release

      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild premium header and controls (1.5.82)'
          git push origin HEAD:main

      - name: Package source
        run: git archive --format=zip --output=WoWServerControlCenter-1.5.82-PremiumUIRebuild.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: WoWServerControlCenter-1.5.82-PremiumUIRebuild
          path: WoWServerControlCenter-1.5.82-PremiumUIRebuild.zip

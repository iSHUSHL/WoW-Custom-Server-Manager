name: PlayerBots DB Port v1594

on:
  push:
    paths:
      - '.github/workflows/playerbots-db-port-v1594.yml'

permissions:
  contents: write

jobs:
  patch-build-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Apply PlayerBots DB port fix
        run: python3 Scripts/apply-v1594-playerbots-db-port-fix.py
      - name: Remove temporary patch files
        run: |
          rm -f Scripts/apply-v1594-playerbots-db-port-fix.py
          rm -f .github/workflows/playerbots-db-port-v1594.yml
      - name: Validate scripts and app
        run: |
          bash -n Build.command
          find Scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          swift build -c release
          grep -q 'PlayerbotsDatabaseInfo' Sources/WoWServerControlCenter/ServerModel.swift
          grep -q 'acore_playerbots' Sources/WoWServerControlCenter/ServerModel.swift
      - name: Commit validated changes
        run: |
          git config user.name 'WoWCC Builder'
          git config user.email 'wowcc-builder@users.noreply.github.com'
          git add -A
          git commit -m 'Fix WotLK PlayerBots MySQL port self-heal (1.5.94)'
          git push origin main
      - name: Stage tracked source without nested ZIP
        run: |
          mkdir -p artifact/WoW-Custom-Server-Manager
          git archive --format=tar HEAD | tar -x -C artifact/WoW-Custom-Server-Manager
      - uses: actions/upload-artifact@v4
        with:
          name: WoWServerControlCenter-1.5.94-PlayerBotsDBPortFix-ONE-ZIP
          path: artifact/WoW-Custom-Server-Manager
          if-no-files-found: error

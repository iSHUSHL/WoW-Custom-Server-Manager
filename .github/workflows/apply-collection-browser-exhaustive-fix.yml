name: Apply Exhaustive Collection Browser Fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-collection-browser-exhaustive-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch collection browser
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sm = Path('Sources/WoWServerControlCenter/ServerModel.swift')
          cv = Path('Sources/WoWServerControlCenter/ContentView.swift')
          build = Path('Build.command')
          rel = Path('RELEASE-NOTES.md')

          s = sm.read_text()

          # Collection Browser must never silently fall back to the tiny curated list.
          old = '''    var catalog: [CatalogEntry] {
        let source = serverCatalog.isEmpty ? BuiltInCatalog.entries(for: selectedExpansion) : serverCatalog
        return source.filter { entry in
'''
          new = '''    var catalog: [CatalogEntry] {
        let source = serverCatalog
        return source.filter { entry in
'''
          if old not in s:
              raise SystemExit('catalog fallback block not found')
          s = s.replace(old, new)

          # Preserve the total result count and expose it to the UI.
          old = '''    @Published var catalogHasMore = false
    @Published var itemIconURLs: [Int: URL] = [:]
'''
          new = '''    @Published var catalogHasMore = false
    @Published var catalogTotalCount = 0
    @Published var itemIconURLs: [Int: URL] = [:]
'''
          if old not in s:
              raise SystemExit('catalog total state insertion point not found')
          s = s.replace(old, new)

          # Reset filters whenever a user switches collection. A previous class/slot/iLvl
          # filter was silently hiding valid All Items / Legendary rows.
          old = '''    func catalogSelectionChanged() {
        cancelPendingIconLoads()
        tooltipQueue.cancelAllOperations()
        tooltipLoadingIDs.removeAll()
        catalogPage = 0
        catalogHasMore = false
        serverCatalog = []

        // Mount rows are inventory-less teaching items; class/slot/iLvl filters
        // from another collection must never hide them by accident.
        if catalogKind == .mount {
            equipSlotFilter = .all
            playerClassFilter = .all
            minimumItemLevel = ""
        }

        loadCatalogPage(reset: true)
    }
'''
          new = '''    func catalogSelectionChanged() {
        cancelPendingIconLoads()
        tooltipQueue.cancelAllOperations()
        tooltipLoadingIDs.removeAll()
        catalogPage = 0
        catalogHasMore = false
        catalogTotalCount = 0
        serverCatalog = []

        // A collection means the complete collection first. Filters are opt-in and
        // therefore reset whenever the collection changes so nothing is hidden.
        searchText = ""
        itemQualityFilter = .all
        equipSlotFilter = .all
        playerClassFilter = .all
        minimumItemLevel = ""

        loadCatalogPage(reset: true)
    }
'''
          if old not in s:
              raise SystemExit('catalogSelectionChanged block not found')
          s = s.replace(old, new)

          # Record the exact COUNT(*) result and clear rows on query failure rather than
          # allowing stale/curated content to look like the complete DB result.
          old = '''                    self.serverCatalog = parsed
                    self.catalogHasMore = hasMore
                    self.mysqlRunning = true
'''
          new = '''                    self.serverCatalog = parsed
                    self.catalogHasMore = hasMore
                    self.catalogTotalCount = total
                    self.mysqlRunning = true
'''
          if old not in s:
              raise SystemExit('catalog success state block not found')
          s = s.replace(old, new)

          old = '''                    self.catalogLoading = false
                    self.catalogStatus = "Catalog DB: \\(error.localizedDescription)"
                    self.statusMessage = self.catalogStatus
'''
          new = '''                    self.catalogLoading = false
                    self.serverCatalog = []
                    self.catalogHasMore = false
                    self.catalogTotalCount = 0
                    self.catalogStatus = "Could not read \\(self.selectedExpansion.title) world DB: \\(error.localizedDescription)"
                    self.statusMessage = self.catalogStatus
'''
          if old not in s:
              raise SystemExit('catalog error block not found')
          s = s.replace(old, new)

          # Reset total alongside other catalog state.
          s = s.replace('''        catalogPage = 0
        catalogHasMore = false
        serverCatalog = []
        gearSets = []
''','''        catalogPage = 0
        catalogHasMore = false
        catalogTotalCount = 0
        serverCatalog = []
        gearSets = []
''')
          s = s.replace('''        catalogPage = 0
        catalogHasMore = false
        serverCatalog = []
        catalogStatus = "Filters reset"
''','''        catalogPage = 0
        catalogHasMore = false
        catalogTotalCount = 0
        serverCatalog = []
        catalogStatus = "Filters reset — click Load to read the complete collection"
''')

          sm.write_text(s)

          c = cv.read_text()

          # Make paging explicit: users can always see total rows and total pages.
          old = '''                if model.catalogPage > 0 {
                    Button("Previous") { model.previousCatalogPage() }
                }
                Text("Page \\(model.catalogPage + 1)").font(.caption.monospacedDigit())
                Button("Next") { model.nextCatalogPage() }
                    .disabled(!model.catalogHasMore || model.catalogLoading)
'''
          new = '''                if model.catalogTotalCount > 0 {
                    Text("\\(model.catalogTotalCount) total")
                        .font(.caption.monospacedDigit().bold())
                        .foregroundStyle(.primary)
                }
                if model.catalogPage > 0 {
                    Button("Previous") { model.previousCatalogPage() }
                }
                let totalPages = max(1, Int(ceil(Double(max(1, model.catalogTotalCount)) / Double(model.catalogPageSize))))
                Text("Page \\(model.catalogPage + 1) of \\(totalPages)").font(.caption.monospacedDigit())
                Button("Next") { model.nextCatalogPage() }
                    .disabled(!model.catalogHasMore || model.catalogLoading)
'''
          if old not in c:
              raise SystemExit('catalog paging UI block not found')
          c = c.replace(old, new)

          # Explain exactly where complete results come from.
          old = 'Browse every collection in the selected expansion database — raid sets, weapons, armor, legendaries, BiS/endgame, bags, mounts and every item.'
          new = 'Browse every row in the installed selected-expansion world database. Collections are complete DB queries; use Previous/Next to move through every result.'
          c = c.replace(old, new)
          cv.write_text(c)

          b = build.read_text()
          import re
          b = re.sub(r'<key>CFBundleShortVersionString</key><string>[^<]+</string>', '<key>CFBundleShortVersionString</key><string>1.5.69</string>', b, count=1)
          b = re.sub(r'<key>CFBundleVersion</key><string>[^<]+</string>', '<key>CFBundleVersion</key><string>1569</string>', b, count=1)
          build.write_text(b)

          note = '''# v1.5.69 — Exhaustive Collection Browser Fix\n\n- Removes the tiny built-in curated fallback from Collection Browser. If the realm DB cannot be read, the browser now shows an explicit database error instead of a misleading handful of items.\n- Switching collections resets search, quality, class, slot and minimum-iLvl filters so All Items and Legendaries start truly unfiltered.\n- Shows exact total result count and `Page X of Y` for database-backed collections.\n- All Items remains a literal `item_template` query for the selected installed expansion world DB.\n- Legendaries remains a literal `Quality = 5` query with no hidden filters after collection selection.\n- Applies to Vanilla, TBC, WotLK, Cataclysm and Mists of Pandaria profiles.\n- A profile must have its world database installed/imported; WoWCC cannot enumerate rows that are not present locally.\n\n'''
          oldrel = rel.read_text()
          if not oldrel.startswith('# v1.5.69'):
              rel.write_text(note + oldrel)
          PY

          bash -n Build.command
          bash -n Verify.command
          find Scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 -m py_compile Scripts/*.py

      - name: Commit exhaustive collection fix
        run: |
          rm .github/workflows/apply-collection-browser-exhaustive-fix.yml
          git config user.name "WoWCC Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix exhaustive collection loading and hidden filters"
          git push

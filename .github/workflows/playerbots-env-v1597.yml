name: PlayerBots Env v1597

on:
  push:
    paths:
      - '.github/workflows/playerbots-env-v1597.yml'

permissions:
  contents: write

jobs:
  patch-build-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Apply 1.5.97 fix
        run: python3 Scripts/apply-v1597-playerbots-env.py
      - name: Remove temporary patch files
        run: |
          rm -f Scripts/apply-v1597-playerbots-env.py
          rm -f .github/workflows/playerbots-env-v1597.yml
      - name: Validate scripts and app
        run: |
          bash -n Build.command
          find Scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          swift build -c release
      - name: Commit validated changes
        run: |
          git config user.name 'WoWCC Builder'
          git config user.email 'wowcc-builder@users.noreply.github.com'
          git add -A
          git commit -m 'Force WotLK PlayerBots DB environment override (1.5.97)'
          git push origin main
      - name: Stage tracked source without nested ZIP
        run: |
          mkdir -p artifact/WoW-Custom-Server-Manager
          git archive --format=tar HEAD | tar -x -C artifact/WoW-Custom-Server-Manager
      - uses: actions/upload-artifact@v4
        with:
          name: WoWServerControlCenter-1.5.97-PlayerBotsEnvFix-ONE-ZIP
          path: artifact/WoW-Custom-Server-Manager
          if-no-files-found: error

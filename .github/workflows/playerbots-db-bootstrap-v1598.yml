name: PlayerBots DB Bootstrap v1598

on:
  push:
    paths:
      - 'Scripts/apply-v1598-playerbots-db-bootstrap.py'
      - '.github/workflows/playerbots-db-bootstrap-v1598.yml'

permissions:
  contents: write

jobs:
  patch-build-package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply 1.5.98 fix
        run: python3 Scripts/apply-v1598-playerbots-db-bootstrap.py

      - name: Remove temporary patch files
        run: |
          rm -f Scripts/apply-v1598-playerbots-db-bootstrap.py
          rm -f .github/workflows/playerbots-db-bootstrap-v1598.yml

      - name: Validate scripts and app
        run: |
          bash -n Build.command
          bash -n Verify.command
          find Scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 -m py_compile Scripts/*.py
          swift build -c release
          grep -q 'ensureWotLKPlayerBotsDatabaseReady' Sources/WoWServerControlCenter/ServerModel.swift
          grep -q 'AC_PLAYERBOTS_DATABASE_INFO' Sources/WoWServerControlCenter/ServerModel.swift
          grep -q '<string>1.5.98</string>' Build.command

      - name: Commit validated changes
        run: |
          git config user.name "Igor Baran"
          git config user.email "igorbaran@gmail.com"
          git add -A
          git commit -m "Bootstrap missing WotLK PlayerBots database before start (1.5.98)"
          git push origin HEAD:main

      - name: Stage tracked source without nested ZIP
        run: |
          rm -rf /tmp/WoWServerControlCenter-1.5.98
          mkdir -p /tmp/WoWServerControlCenter-1.5.98
          git archive --format=tar HEAD | tar -xf - -C /tmp/WoWServerControlCenter-1.5.98

      - uses: actions/upload-artifact@v4
        with:
          name: WoWServerControlCenter-1.5.98-PlayerBotsDBBootstrap-ONE-ZIP
          path: /tmp/WoWServerControlCenter-1.5.98
          include-hidden-files: true
          if-no-files-found: error

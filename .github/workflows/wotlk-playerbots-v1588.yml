name: WotLK PlayerBots v1588
on:
  push:
    paths:
      - 'tools/apply_v1588_wotlk_playerbots_clone_fix.py'
      - '.github/workflows/wotlk-playerbots-v1588.yml'
jobs:
  patch-build-package:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply WotLK PlayerBots repair
        run: python3 tools/apply_v1588_wotlk_playerbots_clone_fix.py
      - name: Remove temporary patch files
        run: rm -f tools/apply_v1588_wotlk_playerbots_clone_fix.py .github/workflows/wotlk-playerbots-v1588.yml
      - name: Validate scripts and app
        run: |
          bash -n Scripts/install-profile.sh
          bash -n Scripts/prepare-client.sh
          bash -n Build.command
          swift build -c release
      - name: Commit validated changes
        run: |
          git config user.name 'Igor Baran'
          git config user.email 'igorbaran@gmail.com'
          git add -A
          git commit -m 'Fix WotLK PlayerBots clone validation and extractor verification (1.5.88)'
          git push origin HEAD:main
      - name: Package source
        run: git archive --format=zip --output=WoWServerControlCenter-1.5.88-WotLKPlayerBotsRepair.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: WoWServerControlCenter-1.5.88-WotLKPlayerBotsRepair
          path: WoWServerControlCenter-1.5.88-WotLKPlayerBotsRepair.zip
          retention-days: 90

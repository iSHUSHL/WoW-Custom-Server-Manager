name: WotLK DataDir v1599

on:
  push:
    paths:
      - '.github/workflows/wotlk-datadir-v1599.yml'

permissions:
  contents: write

jobs:
  patch-build-package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply 1.5.99 fix
        run: python3 Scripts/apply-v1599-wotlk-datadir-fix.py
      - name: Remove temporary patch files
        run: |
          rm -f Scripts/apply-v1599-wotlk-datadir-fix.py
          rm -f .github/workflows/wotlk-datadir-v1599.yml
      - name: Validate scripts and app
        run: |
          bash -n Build.command
          bash -n Verify.command
          find Scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          swift build -c release
          grep -q '1.5.99' Build.command
          grep -q '1599' Build.command
          grep -q 'AC_DATA_DIR' Sources/WoWServerControlCenter/ServerModel.swift
      - name: Commit validated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix WotLK managed DataDir startup (1.5.99)'
          git push
      - name: Stage tracked source without nested ZIP
        run: |
          mkdir -p artifact/WoW-Custom-Server-Manager
          git archive --format=tar HEAD | tar -xf - -C artifact/WoW-Custom-Server-Manager
      - uses: actions/upload-artifact@v4
        with:
          name: WoWServerControlCenter-1.5.99-WotLKDataDirFix-ONE-ZIP
          path: artifact/WoW-Custom-Server-Manager
          if-no-files-found: error

# retry 2

name: WotLK Build Recovery v1608
on:
  push:
    paths:
      - '.github/workflows/wotlk-build-recovery-v1608.yml'
permissions:
  contents: write
jobs:
  patch-build-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.6.8 patch
        run: python3 Scripts/apply-v1608-wotlk-build-recovery.py
      - name: Validate scripts
        run: |
          bash -n Scripts/install-profile.sh
          python3 -m py_compile Scripts/run-core-build-watchdog.py
      - name: Build WoWCC release
        run: swift build -c release
      - name: Remove temporary patch files
        run: |
          rm -f Scripts/apply-v1608-wotlk-build-recovery.py
          rm -f .github/workflows/wotlk-build-recovery-v1608.yml
      - name: Commit v1.6.8
        run: |
          git config user.name 'WoWCC Builder'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'WoWCC 1.6.8 WotLK build recovery'
          git push
      - name: Stage ONE-ZIP source tree
        run: |
          mkdir -p artifact/WoW-Custom-Server-Manager
          git archive --format=tar HEAD | tar -xf - -C artifact/WoW-Custom-Server-Manager
      - uses: actions/upload-artifact@v4
        with:
          name: WoWServerControlCenter-1.6.8-WotLK-BuildRecovery-ONE-ZIP
          path: artifact/WoW-Custom-Server-Manager

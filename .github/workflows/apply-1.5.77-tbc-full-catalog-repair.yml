name: Apply 1.5.77 TBC Full Catalog Repair

on:
  push:
    paths:
      - '.github/workflows/apply-1.5.77-tbc-full-catalog-repair.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch TBC database health and repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Scripts/setup-profile.sh')
          s=p.read_text()
          old='''  DBROOT="$ROOT/sources/$PROFILE/contentdb"\n  REPO="https://github.com/cmangos/classic-db.git"; [[ "$PROFILE" == "tbc" ]] && REPO="https://github.com/cmangos/tbc-db.git"\n'''
          new='''  # A table existing is not enough. A previously interrupted CMaNGOS content\n  # import can leave item_template with only the tiny core/base seed set.\n  if [[ "$PROFILE" == "tbc" ]]; then\n    tbc_item_count="$("${M[@]}" --batch --skip-column-names mangos -e "SELECT COUNT(*) FROM item_template;" 2>/dev/null || echo 0)"\n    tbc_epic_count="$("${M[@]}" --batch --skip-column-names mangos -e "SELECT COUNT(*) FROM item_template WHERE Quality=4;" 2>/dev/null || echo 0)"\n    tbc_legendary_count="$("${M[@]}" --batch --skip-column-names mangos -e "SELECT COUNT(*) FROM item_template WHERE Quality=5;" 2>/dev/null || echo 0)"\n    tbc_mount_count="$("${M[@]}" --batch --skip-column-names mangos -e "SELECT COUNT(*) FROM item_template WHERE (class=15 AND subclass=5) OR name LIKE 'Reins of %' OR name LIKE 'Horn of %' OR name LIKE '%Hawkstrider%' OR name LIKE '%Elekk%' OR name LIKE '%Talbuk%' OR name LIKE '%Nether Ray%' OR name LIKE '%Kodo%' OR name LIKE '%Raptor%' OR name LIKE '%Mechanostrider%';" 2>/dev/null || echo 0)"\n    echo "[realm:tbc] Existing catalog health: items=$tbc_item_count epic=$tbc_epic_count legendary=$tbc_legendary_count mounts=$tbc_mount_count"\n    if (( ${tbc_item_count:-0} < 20000 || ${tbc_epic_count:-0} < 100 || ${tbc_legendary_count:-0} < 1 || ${tbc_mount_count:-0} < 10 )); then\n      echo "[realm:tbc] Incomplete TBC world content detected — rebuilding mangos world DB only."\n      echo "[realm:tbc] Accounts and characters are preserved."\n      "${M[@]}" -e 'DROP DATABASE IF EXISTS mangos; CREATE DATABASE mangos CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'\n    fi\n  fi\n\n  DBROOT="$ROOT/sources/$PROFILE/contentdb"\n  REPO="https://github.com/cmangos/classic-db.git"; [[ "$PROFILE" == "tbc" ]] && REPO="https://github.com/cmangos/tbc-db.git"\n'''
          if old not in s:
              raise SystemExit('TBC DBROOT anchor not found')
          s=s.replace(old,new,1)
          anchor='''  for spec in "${required[@]}"; do\n    db="${spec%%.*}"; table="${spec#*.}"\n    table_exists "$db" "$table" || { echo "ERROR: CMaNGOS database incomplete: missing ${spec}" >&2; exit 42; }\n  done\n\n  copy_conf realmd; copy_conf mangosd\n'''
          insert='''  for spec in "${required[@]}"; do\n    db="${spec%%.*}"; table="${spec#*.}"\n    table_exists "$db" "$table" || { echo "ERROR: CMaNGOS database incomplete: missing ${spec}" >&2; exit 42; }\n  done\n\n  if [[ "$PROFILE" == "tbc" ]]; then\n    final_items="$("${M[@]}" --batch --skip-column-names mangos -e "SELECT COUNT(*) FROM item_template;" 2>/dev/null || echo 0)"\n    final_epics="$("${M[@]}" --batch --skip-column-names mangos -e "SELECT COUNT(*) FROM item_template WHERE Quality=4;" 2>/dev/null || echo 0)"\n    final_legendaries="$("${M[@]}" --batch --skip-column-names mangos -e "SELECT COUNT(*) FROM item_template WHERE Quality=5;" 2>/dev/null || echo 0)"\n    final_mounts="$("${M[@]}" --batch --skip-column-names mangos -e "SELECT COUNT(*) FROM item_template WHERE (class=15 AND subclass=5) OR name LIKE 'Reins of %' OR name LIKE 'Horn of %' OR name LIKE '%Hawkstrider%' OR name LIKE '%Elekk%' OR name LIKE '%Talbuk%' OR name LIKE '%Nether Ray%' OR name LIKE '%Kodo%' OR name LIKE '%Raptor%' OR name LIKE '%Mechanostrider%';" 2>/dev/null || echo 0)"\n    echo "[realm:tbc] Final catalog health: items=$final_items epic=$final_epics legendary=$final_legendaries mounts=$final_mounts"\n    if (( ${final_items:-0} < 20000 || ${final_epics:-0} < 100 || ${final_legendaries:-0} < 1 || ${final_mounts:-0} < 10 )); then\n      echo "ERROR: TBC content DB import is incomplete after repair (items=$final_items, epic=$final_epics, legendary=$final_legendaries, mounts=$final_mounts)." >&2\n      echo "ERROR: Do not mark this realm ready; see the Setup/Repair log in WoWCC Logs." >&2\n      exit 43\n    fi\n  fi\n\n  copy_conf realmd; copy_conf mangosd\n'''
          if anchor not in s:
              raise SystemExit('CMaNGOS verification anchor not found')
          s=s.replace(anchor,insert,1)
          p.write_text(s)

          b=Path('Build.command')
          bs=b.read_text().replace('<string>1.5.76</string>','<string>1.5.77</string>').replace('<string>1576</string>','<string>1577</string>')
          b.write_text(bs)

          r=Path('RELEASE-NOTES.md')
          notes='''# v1.5.77 — TBC Full World Catalog Repair\n\n- Fixes TBC Collections showing only a few items when a partial `mangos.item_template` had been incorrectly accepted as a ready realm.\n- TBC Setup/Repair validates actual item, Epic, Legendary and Mount row counts.\n- An incomplete TBC world catalog automatically rebuilds only `mangos` from official `cmangos/tbc-db`; accounts and characters are preserved.\n- The realm is not marked ready if the repaired catalog still fails validation.\n\n'''
          if not r.read_text().startswith('# v1.5.77'):
              r.write_text(notes+r.read_text())
          PY

      - name: Validate source
        shell: bash
        run: |
          bash -n Build.command
          bash -n Scripts/setup-profile.sh
          swift build

      - name: Commit fixed source
        shell: bash
        run: |
          rm -f .github/workflows/apply-1.5.77-tbc-full-catalog-repair.yml
          git config user.name "WoWCC Builder"
          git config user.email "actions@users.noreply.github.com"
          git add Build.command Scripts/setup-profile.sh RELEASE-NOTES.md .github/workflows/apply-1.5.77-tbc-full-catalog-repair.yml
          git commit -m "Repair incomplete TBC world catalog (1.5.77)"
          git push origin main

      - name: Package clean source ZIP
        shell: bash
        run: |
          rm -rf /tmp/WoWCC-1.5.77
          mkdir -p /tmp/WoWCC-1.5.77
          git archive HEAD | tar -x -C /tmp/WoWCC-1.5.77
          ditto -c -k --sequesterRsrc --keepParent /tmp/WoWCC-1.5.77 WoWServerControlCenter-1.5.77-TBCFullCatalogRepair.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WoWServerControlCenter-1.5.77-TBCFullCatalogRepair
          path: WoWServerControlCenter-1.5.77-TBCFullCatalogRepair.zip
          if-no-files-found: error

name: macOS Build Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Swift package build
        run: swift build -c release

      - name: Verify shell scripts
        run: |
          bash -n Build.command
          bash -n Verify.command
          find Scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Verify Python scripts
        run: |
          python3 -m py_compile Scripts/*.py

      - name: Verify required app sections are present
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('Sources/WoWServerControlCenter/ContentView.swift').read_text()
          required = [
              'Dashboard','Setup Guide','Health Checks','Expansions','Characters',
              'Gear Sets','Collection Browser','Mounts','PlayerBots','Accounts',
              'Database','Logs','Backups','Storage & Cleanup','Settings'
          ]
          missing = [name for name in required if f'"{name}"' not in source]
          if missing:
              raise SystemExit('Missing app sections: ' + ', '.join(missing))
          print('All WoWCC sections are present.')
          PY

name: Catalog Recovery v1583

# retry after correcting the community DB patch marker
on:
  push:
    paths:
      - '.github/workflows/catalog-v1583.yml'

permissions:
  contents: write

jobs:
  patch-build-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Apply catalog recovery patch
        run: python3 Scripts/apply-v1583-catalog-fix.py

      - name: Remove temporary patch files
        run: |
          rm -f Scripts/apply-v1583-catalog-fix.py
          rm -f .github/workflows/catalog-v1583.yml

      - name: Validate and build release
        run: |
          bash -n Build.command
          bash -n Scripts/setup-profile.sh
          bash -n Scripts/setup-community-trinity.sh
          grep -q '<string>1.5.83</string>' Build.command
          grep -q '<string>1583</string>' Build.command
          grep -q 'SHOW COLUMNS FROM item_template' Sources/WoWServerControlCenter/ServerModel.swift
          grep -q 'catalog.log' Sources/WoWServerControlCenter/ServerModel.swift
          grep -q 'Catalog health: items=' Scripts/setup-community-trinity.sh
          swift build -c release

      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Recover WotLK Cata MoP catalogs (1.5.83)'
          git push origin HEAD:main

      - name: Package source
        run: git archive --format=zip --output=WoWServerControlCenter-1.5.83-CatalogRecovery.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: WoWServerControlCenter-1.5.83-CatalogRecovery
          path: WoWServerControlCenter-1.5.83-CatalogRecovery.zip

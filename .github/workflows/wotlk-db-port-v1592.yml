name: WotLK DB Port v1592

on:
  push:
    paths:
      - '.github/workflows/wotlk-db-port-v1592.yml'

permissions:
  contents: write

jobs:
  patch-build-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Apply WotLK DB port fix
        run: python3 Scripts/apply-v1592-wotlk-db-port-fix.py
      - name: Remove temporary patch files
        run: |
          rm -f Scripts/apply-v1592-wotlk-db-port-fix.py
          rm -f .github/workflows/wotlk-db-port-v1592.yml
      - name: Validate scripts and app
        run: |
          bash -n Build.command
          find Scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          swift build -c release
      - name: Commit validated changes
        run: |
          git config user.name 'WoWCC Builder'
          git config user.email 'wowcc-builder@users.noreply.github.com'
          git add -A
          git commit -m 'Fix WotLK managed MySQL port self-heal (1.5.92)'
          git push origin main
      - name: Stage source folder
        run: |
          mkdir -p artifact/WoW-Custom-Server-Manager
          git ls-files -z | xargs -0 -I{} sh -c 'mkdir -p "artifact/WoW-Custom-Server-Manager/$(dirname "{}")"; cp -p "{}" "artifact/WoW-Custom-Server-Manager/{}"'
      - uses: actions/upload-artifact@v4
        with:
          name: WoWServerControlCenter-1.5.92-WotLKDBPortFix-ONE-ZIP
          path: artifact/WoW-Custom-Server-Manager
          if-no-files-found: error

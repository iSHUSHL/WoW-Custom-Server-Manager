name: Premium UI v1581

on:
  push:
    paths:
      - '.github/workflows/premium-ui-v1581.yml'

permissions:
  contents: write

jobs:
  patch-build-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Apply premium UI patch
        run: python3 .github/patch-v1581-premium-ui.py

      - name: Remove temporary patch files
        run: |
          rm -f .github/patch-v1581-premium-ui.py
          rm -f .github/workflows/premium-ui-v1581.yml

      - name: Validate and build release
        run: |
          bash -n Build.command
          find Scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          grep -q '<string>1.5.81</string>' Build.command
          grep -q '<string>1581</string>' Build.command
          grep -q 'SERVER CONTROL CENTER' Sources/WoWServerControlCenter/ContentView.swift
          grep -q 'private var expansionStrip' Sources/WoWServerControlCenter/ContentView.swift
          grep -q 'Image(nsImage: NSApp.applicationIconImage)' Sources/WoWServerControlCenter/ContentView.swift
          swift build -c release

      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Redesign premium header and navigation (1.5.81)'
          git push origin HEAD:main

      - name: Package source
        run: git archive --format=zip --output=WoWServerControlCenter-1.5.81-PremiumUI.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: WoWServerControlCenter-1.5.81-PremiumUI
          path: WoWServerControlCenter-1.5.81-PremiumUI.zip

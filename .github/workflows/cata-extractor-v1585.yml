name: Cataclysm Extractor Fix v1585

on:
  push:
    paths:
      - '.github/workflows/cata-extractor-v1585.yml'

permissions:
  contents: write

jobs:
  patch-build-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Apply Cataclysm extractor patch
        run: python3 Scripts/apply-v1585-cata-extractor-fix.py

      - name: Remove temporary patch files
        run: |
          rm -f Scripts/apply-v1585-cata-extractor-fix.py
          rm -f .github/workflows/cata-extractor-v1585.yml

      - name: Validate and build
        run: |
          bash -n Build.command
          bash -n Scripts/prepare-client.sh
          bash -n Scripts/setup-community-trinity.sh
          grep -q '<string>1.5.85</string>' Build.command
          grep -q '<string>1585</string>' Build.command
          grep -q 'Item-sparse.db2 was not produced' Scripts/prepare-client.sh
          grep -q 'data/db2/Item.db2' Scripts/prepare-client.sh
          swift build -c release

      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Cataclysm DB2 extraction (1.5.85)'
          git push origin HEAD:main

      - name: Package source
        run: git archive --format=zip --output=WoWServerControlCenter-1.5.85-CataExtractorFix.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: WoWServerControlCenter-1.5.85-CataExtractorFix
          path: WoWServerControlCenter-1.5.85-CataExtractorFix.zip

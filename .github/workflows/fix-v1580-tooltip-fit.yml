name: Fix v1580 Tooltip Fit

on:
  push:
    paths:
      - '.github/workflows/fix-v1580-tooltip-fit.yml'

permissions:
  contents: write

jobs:
  patch-build-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Apply tooltip auto-fit patch
        run: python3 Scripts/apply-v1580.py

      - name: Remove temporary patch files
        run: |
          rm -f Scripts/apply-v1580.py
          rm -f .github/workflows/fix-v1580-tooltip-fit.yml

      - name: Validate and build release
        run: |
          bash -n Build.command
          find Scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          grep -q '<string>1.5.80</string>' Build.command
          grep -q '<string>1580</string>' Build.command
          grep -q 'host.fittingSize' Sources/WoWServerControlCenter/ContentView.swift
          swift build -c release

      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix tooltip sizing and remove dead scrollbar (1.5.80)'
          git push origin HEAD:main

      - name: Package source
        run: git archive --format=zip --output=WoWServerControlCenter-1.5.80-TooltipAutoFit.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: WoWServerControlCenter-1.5.80-TooltipAutoFit
          path: WoWServerControlCenter-1.5.80-TooltipAutoFit.zip

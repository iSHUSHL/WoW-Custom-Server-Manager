name: WotLK Port Owner v1601

on:
  push:
    paths:
      - '.github/workflows/wotlk-port-owner-v1601.yml'

permissions:
  contents: write

env:
  WOWCC_V1601_RETRY: '2'

jobs:
  patch-build-package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply 1.6.1 fix
        run: python3 Scripts/apply-v1601-port-owner-fix.py
      - name: Remove temporary patch files
        run: |
          rm -f Scripts/apply-v1601-port-owner-fix.py
          rm -f .github/workflows/wotlk-port-owner-v1601.yml
      - name: Validate scripts and app
        run: |
          bash -n Build.command
          bash -n Verify.command
          find Scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          swift build -c release
          grep -q '1.6.1' Build.command
          grep -q '1601' Build.command
          grep -q 'ensureSelectedServerOwnsPort' Sources/WoWServerControlCenter/ServerModel.swift
          grep -q 'port-ownership.log' Sources/WoWServerControlCenter/ServerModel.swift
      - name: Commit validated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix stale realm port ownership (1.6.1)'
          git push
      - name: Stage tracked source without nested ZIP
        run: |
          mkdir -p artifact/WoW-Custom-Server-Manager
          git archive --format=tar HEAD | tar -xf - -C artifact/WoW-Custom-Server-Manager
      - uses: actions/upload-artifact@v4
        with:
          name: WoWServerControlCenter-1.6.1-PortOwnershipFix-ONE-ZIP
          path: artifact/WoW-Custom-Server-Manager
          if-no-files-found: error

name: Cataclysm DB2 Fix v1584

on:
  push:
    paths:
      - '.github/workflows/cata-v1584.yml'

permissions:
  contents: write

jobs:
  patch-build-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Apply Cataclysm DB2 fix
        run: python3 Scripts/apply-v1584-cata-db2-fix.py

      - name: Remove temporary patch files
        run: |
          rm -f Scripts/apply-v1584-cata-db2-fix.py
          rm -f .github/workflows/cata-v1584.yml

      - name: Validate scripts and release build
        run: |
          python3 -m py_compile Scripts/build-cata-catalog.py
          bash -n Build.command
          bash -n Scripts/setup-community-trinity.sh
          grep -q '<string>1.5.84</string>' Build.command
          grep -q '<string>1584</string>' Build.command
          grep -q 'wowcc_item_template' Sources/WoWServerControlCenter/ServerModel.swift
          grep -q 'HotfixDatabaseInfo' Scripts/setup-community-trinity.sh
          grep -q 'build-cata-catalog.py' Scripts/setup-community-trinity.sh
          swift build -c release

      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Cataclysm DB2 realm and catalog (1.5.84)'
          git push origin HEAD:main

      - name: Package source
        run: git archive --format=zip --output=WoWServerControlCenter-1.5.84-CataDB2Fix.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: WoWServerControlCenter-1.5.84-CataDB2Fix
          path: WoWServerControlCenter-1.5.84-CataDB2Fix.zip

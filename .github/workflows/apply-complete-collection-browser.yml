name: Apply Complete Collection Browser

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-complete-collection-browser.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch collection browser for all expansions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sm = Path('Sources/WoWServerControlCenter/ServerModel.swift')
          cv = Path('Sources/WoWServerControlCenter/ContentView.swift')
          build = Path('Build.command')
          rel = Path('RELEASE-NOTES.md')
          readme = Path('README.md')

          s = sm.read_text()
          s = s.replace('@Published var catalogStatus = "Built-in curated catalog"', '@Published var catalogStatus = "Choose a collection to load every matching item from the selected realm database"')

          old = '''        let offset = page * pageSize
                  let sql = """
                  SELECT entry,name,Quality,class,subclass,InventoryType,ItemLevel,itemset,AllowableClass
                  FROM item_template
                  WHERE \\(whereClause)
                  ORDER BY ItemLevel DESC, Quality DESC, name, entry
                  LIMIT \\(pageSize + 1) OFFSET \\(offset);
                  """
          '''
          new = '''        let offset = page * pageSize
                  let countSQL = "SELECT COUNT(*) FROM item_template WHERE \\(whereClause);"
                  let sql = """
                  SELECT entry,name,Quality,class,subclass,InventoryType,ItemLevel,itemset,AllowableClass
                  FROM item_template
                  WHERE \\(whereClause)
                  ORDER BY ItemLevel DESC, Quality DESC, name, entry
                  LIMIT \\(pageSize) OFFSET \\(offset);
                  """
          '''
          if old not in s:
              raise SystemExit('ServerModel catalog SQL block not found')
          s = s.replace(old, new)

          old = '''                let client = DatabaseClient(executable: mysqlExecutable, port: port)
                          let raw = try client.query(database: db, sql: sql)
                          var parsed: [CatalogEntry] = raw.split(separator:"\\n").compactMap { line in
          '''
          new = '''                let client = DatabaseClient(executable: mysqlExecutable, port: port)
                          let totalRaw = try client.query(database: db, sql: countSQL)
                          let total = Int(totalRaw.trimmingCharacters(in: .whitespacesAndNewlines)) ?? 0
                          let raw = try client.query(database: db, sql: sql)
                          let parsed: [CatalogEntry] = raw.split(separator:"\\n").compactMap { line in
          '''
          if old not in s:
              raise SystemExit('ServerModel catalog parse block not found')
          s = s.replace(old, new)

          old = '''                let hasMore = parsed.count > pageSize
                          if hasMore { parsed.removeLast(parsed.count - pageSize) }

                          DispatchQueue.main.async {
                              self.serverCatalog = parsed
                              self.catalogHasMore = hasMore
          '''
          new = '''                let hasMore = offset + parsed.count < total

                          DispatchQueue.main.async {
                              self.serverCatalog = parsed
                              self.catalogHasMore = hasMore
          '''
          if old not in s:
              raise SystemExit('ServerModel paging block not found')
          s = s.replace(old, new)

          old = '''                    self.catalogStatus = parsed.isEmpty
                                  ? "No \\(kind.rawValue) found on page \\(page + 1)"
                                  : "\\(kind.rawValue): showing \\(first)–\\(last) from the realm DB"
          '''
          new = '''                    self.catalogStatus = parsed.isEmpty
                                  ? "No \\(kind.rawValue) found in \\(self.selectedExpansion.title)"
                                  : "\\(kind.rawValue): showing \\(first)–\\(last) of \\(total) from \\(self.selectedExpansion.title) realm DB"
          '''
          if old not in s:
              raise SystemExit('ServerModel status block not found')
          s = s.replace(old, new)

          s = s.replace('catalogStatus = "Built-in curated catalog"', 'catalogStatus = "Choose a collection and click Load"')

          marker = '    func searchServerCatalog() { loadCatalogPage(reset: true) }\n'
          insert = '''    func catalogSelectionChanged() {
                  cancelPendingIconLoads()
                  tooltipQueue.cancelAllOperations()
                  tooltipLoadingIDs.removeAll()
                  catalogPage = 0
                  catalogHasMore = false
                  serverCatalog = []

                  // Mount rows are inventory-less teaching items; class/slot/iLvl filters
                  // from another collection must never hide them by accident.
                  if catalogKind == .mount {
                      equipSlotFilter = .all
                      playerClassFilter = .all
                      minimumItemLevel = ""
                  }

                  loadCatalogPage(reset: true)
              }

              func searchServerCatalog() { loadCatalogPage(reset: true) }
          '''
          if marker not in s:
              raise SystemExit('ServerModel insertion marker not found')
          s = s.replace(marker, insert)
          sm.write_text(s)

          c = cv.read_text()
          old = '''                    Text(mountOnly
                                   ? "All mount teaching items found in the selected realm database."
                                   : "Browse the complete TBC / WotLK realm catalog: raid sets, weapons, armor, legendaries, BiS/endgame and all items.")
          '''
          new = '''                    Text(mountOnly
                                   ? "All mount teaching items found in the selected realm database."
                                   : "Browse every collection in the selected expansion database — raid sets, weapons, armor, legendaries, BiS/endgame, bags, mounts and every item.")
          '''
          if old not in c:
              raise SystemExit('ContentView subtitle block not found')
          c = c.replace(old, new)

          old = '''                    ForEach(CatalogKind.allCases.filter{$0 != .mount && $0 != .bag}) {
                                  Text($0.rawValue).tag($0)
                              }
                          }
                          .pickerStyle(.segmented)
                          .onChange(of:model.catalogKind) { _ in
                              model.clearServerCatalog()
                          }
          '''
          new = '''                    ForEach(CatalogKind.allCases) {
                                  Text($0.rawValue).tag($0)
                              }
                          }
                          .pickerStyle(.menu)
                          .frame(width: 220, alignment: .leading)
                          .onChange(of:model.catalogKind) { _ in
                              model.catalogSelectionChanged()
                          }
                          .onAppear {
                              if model.serverCatalog.isEmpty && !model.catalogLoading {
                                  model.loadCatalogPage(reset: true)
                              }
                          }
          '''
          if old not in c:
              raise SystemExit('ContentView collection picker block not found')
          c = c.replace(old, new)
          c = c.replace('model.selectedExpansion != .tbc || cls != .deathKnight', '(model.selectedExpansion != .tbc && model.selectedExpansion != .vanilla) || cls != .deathKnight')
          cv.write_text(c)

          b = build.read_text()
          b = b.replace('<key>CFBundleShortVersionString</key><string>1.5.65</string>', '<key>CFBundleShortVersionString</key><string>1.5.68</string>')
          b = b.replace('<key>CFBundleShortVersionString</key><string>1.5.67</string>', '<key>CFBundleShortVersionString</key><string>1.5.68</string>')
          b = b.replace('<key>CFBundleVersion</key><string>1542</string>', '<key>CFBundleVersion</key><string>1568</string>')
          b = b.replace('<key>CFBundleVersion</key><string>1567</string>', '<key>CFBundleVersion</key><string>1568</string>')
          build.write_text(b)

          note = '''# v1.5.68 — Complete Expansion Collection Browser

          - Collection Browser now exposes every existing collection type, including Bags and Mounts.
          - Switching collections automatically loads the selected collection instead of clearing the grid and waiting for another click.
          - All Items is database-backed and exposes the complete `item_template` catalog for the selected expansion through paging.
          - Every page now reports its real total count, so no items are silently hidden behind the first 250 rows.
          - Legendaries query the realm database directly with `Quality = 5`, including all TBC legendary entries present in the installed TBC database.
          - The same database-backed path is used for Vanilla, TBC, WotLK, Cataclysm, and Mists of Pandaria profiles.
          - Changing expansions clears stale filters/catalog state before the new expansion is loaded.
          - Death Knight filtering is no longer offered for Vanilla or TBC.
          - Existing premium UI, Dock icon/title branding, server controls, PlayerBots, logs, and gameplay fixes remain intact.

          '''
          if not rel.read_text().startswith('# v1.5.68'):
              rel.write_text(note + rel.read_text())

          r = readme.read_text()
          marker = '### Items, gear, and collections\n'
          addition = '''### Items, gear, and collections
          - Collection Browser reads directly from the selected expansion world database for Vanilla, TBC, WotLK, Cataclysm, and Mists of Pandaria.
          - All Items exposes every `item_template` row through complete paging with total counts; collection switching loads automatically.
          - Collection types include raid sets, weapons, armor, legendaries, BiS/endgame, bags, mounts, and the complete item catalog.
          '''
          if 'All Items exposes every `item_template` row' not in r:
              r = r.replace(marker, addition)
          readme.write_text(r)
          PY

          bash -n Build.command
          bash -n Verify.command
          find Scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 -m py_compile Scripts/*.py

      - name: Commit complete collection browser
        run: |
          rm .github/workflows/apply-complete-collection-browser.yml
          git config user.name "WoWCC Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix complete collection browser for all expansions"
          git push
